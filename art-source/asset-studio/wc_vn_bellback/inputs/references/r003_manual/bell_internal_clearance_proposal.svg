<text x="571.50" y="280.00" font-family="sans-serif" font-size="14" font-weight="normal" fill="#27363c" text-anchor="start">Internal rod 360</text>
<text x="571.50" y="311.50" font-family="sans-serif" font-size="14" font-weight="normal" fill="#27363c" text-anchor="start">Striker radius 55</text>
<text x="582.00" y="371.00" font-family="sans-serif" font-size="15" font-weight="bold" fill="#27363c" text-anchor="start">Stops ±12°</text>
<text x="71.00" y="982.00" font-family="sans-serif" font-size="14" font-weight="normal" fill="#27363c" text-anchor="start">Section axis: +Y forward →    +Z upward ↑</text>
<text x="1034.00" y="167.00" font-family="sans-serif" font-size="21" font-weight="bold" fill="#27363c" text-anchor="start">ASSEMBLY AND LIMITS</text>
<text x="1034.00" y="212.00" font-family="sans-serif" font-size="15" font-weight="bold" fill="#27363c" text-anchor="start">MAIN BELL</text>
<text x="1034.00" y="238.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">Hollow arched shell reaches Z 2200.</text>
<text x="1034.00" y="262.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">Crown suspension supports an internal</text>
<text x="1034.00" y="286.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">rod and striker; the small neck pendants</text>
<text x="1034.00" y="310.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">are separate decorative parts.</text>
<text x="1034.00" y="356.00" font-family="sans-serif" font-size="15" font-weight="bold" fill="#27363c" text-anchor="start">BODY AND MOUNT</text>
<text x="1034.00" y="382.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">Body-top target: Z 1170 maximum.</text>
<text x="1034.00" y="406.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">Two contoured saddle pads support a</text>
<text x="1034.00" y="430.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">new proposed carrier at Z 1270–1320.</text>
<text x="1034.00" y="454.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">Shell rim seats on the carrier top.</text>
<text x="1034.00" y="500.00" font-family="sans-serif" font-size="15" font-weight="bold" fill="#27363c" text-anchor="start">CLEARANCE</text>
<text x="1034.00" y="526.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">At rest: striker bottom Z 1605.</text>
<text x="1034.00" y="550.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">Body gap 435; carrier gap 285.</text>
<text x="1034.00" y="574.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">The full ±12° sweep is checked against</text>
<text x="1034.00" y="598.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">the declared section cavity and body.</text>
<text x="1034.00" y="644.00" font-family="sans-serif" font-size="15" font-weight="bold" fill="#27363c" text-anchor="start">WHAT THE SWING MEANS</text>
<text x="1034.00" y="670.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">Small visual motion with hard stops.</text>
<text x="1034.00" y="694.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">No physical acoustics or shell strike is</text>
<text x="1034.00" y="718.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">claimed by this engineering diagram.</text>
<text x="1034.00" y="742.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">Rod and striker never pass through bark.</text>
<text x="1034.00" y="788.00" font-family="sans-serif" font-size="15" font-weight="bold" fill="#27363c" text-anchor="start">STILL TO RECONCILE</text>
<text x="1034.00" y="814.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">Transverse bell/body clearance; gait and</text>
<text x="1034.00" y="838.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">shoulder sweeps; mount fasteners; final</text>
<text x="1034.00" y="862.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">front/side body proportions. This section</text>
<text x="1034.00" y="886.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">does not clear the formal reference gate.</text>
<text x="42.00" y="1056.00" font-family="sans-serif" font-size="16" font-weight="normal" fill="#27363c" text-anchor="start">CONTROL AUTHORITY: this proposed section replaces the r002 exterior-bell clapper inset only; selected creature identity remains the art anchor.</text>
<text x="42.00" y="1096.00" font-family="sans-serif" font-size="15" font-weight="bold" fill="#27363c" text-anchor="start">PROPOSED CONSTRUCTION • HUMAN REFERENCE APPROVAL PENDING • NO MEASUREMENTS RECOVERED FROM RASTER ART</text>
