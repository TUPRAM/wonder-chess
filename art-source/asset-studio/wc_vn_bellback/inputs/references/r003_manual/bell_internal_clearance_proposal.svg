<text x="130.50" y="710.50" font-family="sans-serif" font-size="14" font-weight="normal" fill="#27363c" text-anchor="start">not final anatomy</text>
<text x="722.00" y="497.00" font-family="sans-serif" font-size="14" font-weight="normal" fill="#27363c" text-anchor="start">Carrier + saddles</text>
