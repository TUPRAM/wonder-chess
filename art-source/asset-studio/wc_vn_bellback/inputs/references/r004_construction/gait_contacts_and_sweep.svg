<text x="460.000" y="736.000" font-family="sans-serif" font-size="15" font-weight="bold" fill="#28453d" text-anchor="start">Shoulder Y 580 / Z 900</text>
<text x="460.000" y="766.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Upper + lower lengths: 260 + 260</text>
<text x="460.000" y="796.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Fore wrist: Z 420 + swing lift</text>
<text x="460.000" y="826.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Foot reaches Y 430 .. 670</text>
<text x="460.000" y="856.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Swing lift 0 .. 70; body bob 0</text>
<text x="460.000" y="886.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Hind lengths: 250 + 240</text>
<text x="460.000" y="916.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Hind ankle: Z 378 + swing lift</text>
<text x="50.000" y="1043.000" font-family="sans-serif" font-size="14" font-weight="normal" fill="#28453d" text-anchor="start">Capsules bound proposed joints. Actual flesh, skinning and contacts require later mesh/rig tests.</text>
<text x="915.000" y="656.000" font-family="sans-serif" font-size="19" font-weight="bold" fill="#28453d" text-anchor="start">CONTACT AND ATTACHMENT CONTRACT</text>
<text x="915.000" y="695.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">1.6 s cycle; 75% stance; one swing leg at a time.</text>
<text x="915.000" y="727.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Relative stance travel: +120 to -120 mm.</text>
<text x="915.000" y="759.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Root travel: +320 mm / cycle balances stance drift.</text>
<text x="915.000" y="791.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Swing order: HL, FR, HR, FL in this phase convention.</text>
<text x="915.000" y="823.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Stance pads and all four toe bottoms stay at Z = 0.</text>
<text x="915.000" y="855.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Feet stay within a proposed 2 m X/Y animation cell.</text>
<text x="915.000" y="887.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Bell and frame follow the body root as rigid objects.</text>
<text x="915.000" y="919.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Clapper owns only its bounded +/-12 degree swing.</text>
<text x="915.000" y="951.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">No bob, tilt, physics or contact solver is proved here.</text>
<text x="915.000" y="983.000" font-family="sans-serif" font-size="15" font-weight="normal" fill="#28453d" text-anchor="start">Turning, attack braces, hits and defeat need rig review.</text>
<text x="48.000" y="1120.000" font-family="sans-serif" font-size="20" font-weight="bold" fill="#28453d" text-anchor="start">WHAT THIS CLOSES FOR REFERENCE REVIEW</text>
<text x="48.000" y="1154.000" font-family="sans-serif" font-size="16" font-weight="normal" fill="#28453d" text-anchor="start">A four-leg skeleton route, neutral contacts, a continuous proposed foot path and explicit mount separation can be built without guessing.</text>
<text x="48.000" y="1187.000" font-family="sans-serif" font-size="16" font-weight="normal" fill="#28453d" text-anchor="start">What it does not close: believable weight, planted paws on an actual mesh, motion transitions, bell acoustics, or normal-speed play quality.</text>
<text x="48.000" y="1220.000" font-family="sans-serif" font-size="16" font-weight="normal" fill="#28453d" text-anchor="start">Geometry checks sample 193 gait phases and 97 clapper angles; see the verification report for scope and measured values from these equations.</text>
</svg>
