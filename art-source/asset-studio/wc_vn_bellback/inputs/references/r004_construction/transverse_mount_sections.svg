<text x="50.000" y="882.000" font-family="sans-serif" font-size="20" font-weight="bold" fill="#28453d" text-anchor="start">CONSTRUCTION DECISIONS</text>
<text x="50.000" y="917.000" font-family="sans-serif" font-size="16" font-weight="normal" fill="#28453d" text-anchor="start">Bell is an elliptical shell: X half-width = 0.92 x Y half-width at every height; crown target Z = 2200.</text>
<text x="50.000" y="948.000" font-family="sans-serif" font-size="16" font-weight="normal" fill="#28453d" text-anchor="start">Carrier spine matches the r003 longitudinal section. Saddles contact the back at Y = +/-450; they do not fill the central cavity.</text>
<text x="50.000" y="979.000" font-family="sans-serif" font-size="16" font-weight="normal" fill="#28453d" text-anchor="start">Crown hanger anchors at Z 2160; hinge at Z 2020. Clapper rod 360, striker radius 55, bounded +/-12 degree Y/Z swing.</text>
<text x="50.000" y="1010.000" font-family="sans-serif" font-size="16" font-weight="normal" fill="#28453d" text-anchor="start">The clapper remains inside a hollow volume. Optional neck bells are separate decorations. No physical striking or acoustic claim.</text>
<text x="50.000" y="1041.000" font-family="sans-serif" font-size="16" font-weight="normal" fill="#28453d" text-anchor="start">The proposed 3D shell sample and mount clearances are recorded in geometry_verification.json; real mesh/deformation review is later.</text>
